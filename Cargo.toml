[package]
name = "inkling-dev"
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
description = "Tells an agent when a pull request, Jira issue or Slack message it cares about changes."
license = "MIT"
repository = "https://github.com/dpep/inkling"
readme = "README.md"
keywords = ["github", "jira", "slack", "claude", "notifications"]
categories = ["command-line-utilities", "development-tools"]
autobins = false
include = ["src/**", "README.md", "CHANGELOG.md", "LICENSE*", "Cargo.toml", "Cargo.lock"]

# The crates.io name `inkling` belongs to an unrelated crate; the binary and
# library keep it.
[lib]
name = "inkling"
path = "src/lib.rs"

[[bin]]
name = "inkling"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive"] }
humantime = "2"
iriq = { version = "0.34", default-features = false }
libc = "0.2.189"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.9"
toml_edit = "0.25.13"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
ureq = { version = "3", features = ["json"] }
