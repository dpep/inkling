[package]
name = "inkling"
version = "0.1.0"
edition = "2024"
description = "Annotates Slack messages with the current state of the things they link to."
license = "MIT"
repository = "https://github.com/dpep/inkling"

[features]
# Exposes the fakes in `testing` so integration tests can drive the pipeline
# without a network.
test-support = []

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive"] }
humantime-serde = "1"
iriq = { version = "0.34", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.9"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
ureq = { version = "3", features = ["json"] }

# Self-reference so `cargo test` turns the fakes on without anyone having to
# remember a feature flag.
[dev-dependencies]
inkling = { path = ".", features = ["test-support"] }
